[workspace]
resolver = "3"
members = ["api", "communication", "utils", "server", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
accentor-api = { path = "api" }
accentor-communication = { path = "communication" }
accentor-utils = { path = "utils" }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
dirs = "6.0"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
rodio = "0.22"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
stream-download = { version = "0.24", features = ["reqwest", "temp-storage"] }
strum = { version = "0.28", features = ["derive"] }
tarpc = { version = "0.38", features = ["serde-transport", "serde-transport-json", "unix"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
viuer = { version = "0.11", features = ["icy_sixel"] }
