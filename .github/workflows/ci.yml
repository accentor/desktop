name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  build:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.chvp.be
          cache: accentor
          token: '${{ secrets.ATTIC_AUTH_TOKEN }}'
      - run: nix build .#default --print-build-logs

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.chvp.be
          cache: accentor
          token: '${{ secrets.ATTIC_AUTH_TOKEN }}'
      - run: nix build -L .#checks.x86_64-linux.cargo-fmt

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.chvp.be
          cache: accentor
          token: '${{ secrets.ATTIC_AUTH_TOKEN }}'
      - run: nix build -L .#checks.x86_64-linux.cargo-clippy

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.chvp.be
          cache: accentor
          token: '${{ secrets.ATTIC_AUTH_TOKEN }}'
      - run: nix develop --command cargo test --workspace --all-targets
