[workspace]
resolver = "3"
members = ["communication", "utils", "server", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
dirs = "6.0"
futures = "0.3"
tarpc = { version = "0.37", features = ["serde-transport", "serde-transport-json", "unix"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
accentor-communication = { path = "communication" }
accentor-utils = { path = "utils" }
